<!doctype html>
<html lang="{{ language|default('en') }}" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#122B46">
    <title>{% block title %}{{ t.login_title }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: { sans: ['Montserrat', 'sans-serif'] }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-full bg-[#F1F8FF] font-sans text-slate-700 antialiased">
    <header class="absolute inset-x-0 top-0">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-5 sm:px-6 lg:px-8">
        <a href="/login" class="text-base font-bold tracking-tight text-[#122B46] sm:text-lg">
          🐟 Somali Fish Trace
        </a>
        <nav class="flex items-center gap-1 rounded-lg border border-slate-200 bg-white p-1 text-xs font-semibold shadow-sm" aria-label="{{ t.language }}">
          <a href="{{ request.url.path }}?lang=en" lang="en" {% if language == 'en' %}aria-current="page"{% endif %} class="rounded-md px-3 py-2 transition-colors hover:text-[#122B46] {% if language == 'en' %}bg-[#122B46] text-white{% else %}text-slate-600{% endif %}">English</a>
          <a href="{{ request.url.path }}?lang=so" lang="so" {% if language == 'so' %}aria-current="page"{% endif %} class="rounded-md px-3 py-2 transition-colors hover:text-[#122B46] {% if language == 'so' %}bg-[#122B46] text-white{% else %}text-slate-600{% endif %}">Somali</a>
        </nav>
      </div>
    </header>

    <main class="flex min-h-screen items-center justify-center px-4 pb-10 pt-24 sm:px-6">
      <section class="w-full max-w-md overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl shadow-[#122B46]/10">
        <div class="h-1.5 bg-gradient-to-r from-[#F36724] to-[#FDBA06]"></div>
        <div class="px-6 py-8 sm:px-10 sm:py-10">
          <div class="mb-8">
            <div class="mb-5 flex h-12 w-12 items-center justify-center rounded-xl bg-[#122B46] text-2xl shadow-sm" aria-hidden="true">🐟</div>
            <p class="text-xs font-semibold uppercase tracking-[0.16em] text-[#267F82]">{{ t.secure_portal }}</p>
            <h1 class="mt-2 text-2xl font-bold tracking-tight text-[#122B46] sm:text-3xl">{{ t.welcome_back }}</h1>
            <p class="mt-2 text-sm leading-6 text-slate-500">{{ t.login_description }}</p>
          </div>

          {% if error is defined and error %}
            <div class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">{{ error }}</div>
          {% endif %}

          <form method="POST" action="/auth/login" class="space-y-5">
            <div>
              <label for="email" class="mb-2 block text-sm font-semibold text-[#122B46]">{{ t.email }}</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                inputmode="email"
                required
                autofocus
                value="{{ email|default('', true) }}"
                placeholder="{{ t.email_placeholder }}"
                class="min-h-12 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-[#122B46] outline-none transition placeholder:text-slate-400 focus:border-[#267F82] focus:ring-4 focus:ring-[#267F82]/10"
              >
            </div>

            <div>
              <div class="mb-2 flex items-center justify-between gap-3">
                <label for="password" class="block text-sm font-semibold text-[#122B46]">{{ t.password }}</label>
                <a href="/forgot-password" class="text-xs font-semibold text-[#267F82] transition-colors hover:text-[#122B46]">{{ t.forgot_password }}</a>
              </div>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="{{ t.enter_password }}"
                class="min-h-12 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-[#122B46] outline-none transition placeholder:text-slate-400 focus:border-[#267F82] focus:ring-4 focus:ring-[#267F82]/10"
              >
            </div>

            <button
              type="submit"
              class="inline-flex min-h-12 w-full items-center justify-center rounded-lg bg-gradient-to-r from-[#F36724] to-[#FDBA06] px-5 py-3 text-sm font-bold text-white shadow-sm transition duration-200 hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#F36724] focus-visible:ring-offset-2 active:scale-[0.99]"
            >{{ t.login }}</button>
          </form>

          <div class="mt-8 border-t border-slate-100 pt-5 text-center">
            <p class="text-xs leading-5 text-slate-500">{{ t.authorized_notice }}</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
